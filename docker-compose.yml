version: '3.8'

services:
  # 1. PostgreSQL Database
  db:
    image: postgres:15-alpine
    # REMOVED container_name to prevent conflicts with other Akademia projects
    restart: always
    environment:
      POSTGRES_USER: akademia_admin
      POSTGRES_PASSWORD: akademia_123
      POSTGRES_DB: akademia_cms
    # REMOVED ports: production traffic should only go through Nginx
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akademia_admin -d akademia_cms"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Backend
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    # REMOVED container_name
    restart: always
    # REMOVED ports: internal communication only
    environment:
      DATABASE_URL: postgresql://akademia_admin:akademia_123@db:5432/akademia_cms
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  # 3. Next.js Frontend
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    # REMOVED container_name
    restart: always
    # REMOVED ports: internal communication only
    environment:
      # Changed to /api so Nginx routes it correctly in production
      NEXT_PUBLIC_API_URL: /api 
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  # 4. Nginx Reverse Proxy (The ONLY service exposing a port)
  nginx:
    image: nginx:alpine
    # REMOVED container_name
    restart: always
    ports:
      - "80:80" # Only port 80 is exposed to the outside world
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data: